[project]
name = "povray-jupyter"
version = "0.1.0"
description = "POV-Ray rendering for Jupyter notebooks"
readme = "README.md"
authors = [
    { name = "Luna", email = "itsactuallyluna9@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ipython>=8.39.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.5.6",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
