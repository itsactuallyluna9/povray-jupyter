name: Build & Test

on:
  push:
    branches:
      main
  pull_request:
    branches:
      main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
            python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev
      - name: Test
        run: uv run pytest
